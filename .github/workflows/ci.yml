name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Verificar sintaxis de Python
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 4. Construir Imagen de Docker
        run: |
          docker build -t dashboard-mlops:test .
